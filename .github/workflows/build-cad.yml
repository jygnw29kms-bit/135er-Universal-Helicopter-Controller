name: Build FDM CAD

on:
  push:
    paths:
      - "cad/**"
      - ".github/workflows/build-cad.yml"
  workflow_dispatch:

jobs:
  build-stl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad zip
      - name: Export production and validation STL files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stl/cyclic build/stl/collective build/stl/pedals build/stl/validation
          for module in cyclic collective pedals; do
            for src in cad/$module/src/*.scad; do
              name=$(basename "$src" .scad)
              case "$name" in
                parameters|preview_assembly) continue ;;
              esac
              openscad -o "build/stl/$module/${name}.stl" "$src"
            done
          done

          openscad -o build/stl/validation/VALIDATION_PLATE_01.stl cad/validation/src/validation_plate_01.scad
          for part in bearing shaft magnet tube fastener; do
            openscad -D "part=\"$part\"" -o "build/stl/validation/${part}_fit_coupon.stl" cad/validation/src/fit_coupons.scad
          done

          cd build
          zip -r 135er-helicopter-controller-v1-stl.zip stl
      - uses: actions/upload-artifact@v4
        with:
          name: 135er-helicopter-controller-v1-stl
          path: build/135er-helicopter-controller-v1-stl.zip
