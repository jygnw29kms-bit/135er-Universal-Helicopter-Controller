name: Deploy dezender website

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - cad/**
      - scripts/**
      - .github/workflows/deploy-dezender.yml
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEZENDER_HOST: ${{ secrets.DEZENDER_HOST }}
      DEZENDER_USER: ${{ secrets.DEZENDER_USER }}
      DEZENDER_PASSWORD: ${{ secrets.DEZENDER_PASSWORD }}
      DEZENDER_FTP_PATH: ${{ secrets.DEZENDER_FTP_PATH }}
      DEZENDER_SSH_USER: ${{ secrets.DEZENDER_SSH_USER }}
      DEZENDER_SSH_PASSWORD: ${{ secrets.DEZENDER_SSH_PASSWORD }}
      DEZENDER_SSH_PORT: ${{ secrets.DEZENDER_SSH_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEZENDER_HOST"
          test -n "$DEZENDER_SSH_USER"
          test -n "$DEZENDER_SSH_PASSWORD"
          test -n "$DEZENDER_SSH_PORT"

      - name: Install deploy tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass openscad zip xvfb webp

      - name: Build website STL downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/downloads/stl/build/{cyclic,collective,pedals,electronics,validation}

          for module in cyclic collective pedals electronics; do
            for src in cad/$module/src/*.scad; do
              name=$(basename "$src" .scad)
              case "$name" in
                parameters|preview_assembly) continue ;;
              esac
              openscad -o "site/downloads/stl/build/$module/${name}.stl" "$src"
            done
          done

          openscad -o site/downloads/stl/build/validation/VALIDATION_PLATE_01.stl cad/validation/src/validation_plate_01.scad

          (cd site/downloads/stl/build/cyclic && zip -r ../../135er_Heli_Control_Cyclic_STL.zip .)
          (cd site/downloads/stl/build/collective && zip -r ../../135er_Heli_Control_Collective_STL.zip .)
          (cd site/downloads/stl/build/pedals && zip -r ../../135er_Heli_Control_Pedals_STL.zip .)
          (cd site/downloads/stl/build && zip -r ../135er_Heli_Control_All_STL.zip cyclic collective pedals electronics validation)

          test -s site/downloads/stl/135er_Heli_Control_Cyclic_STL.zip
          test -s site/downloads/stl/135er_Heli_Control_Collective_STL.zip
          test -s site/downloads/stl/135er_Heli_Control_Pedals_STL.zip
          test -s site/downloads/stl/135er_Heli_Control_All_STL.zip

          for module in cyclic collective pedals; do
            count=$(find "site/downloads/stl/build/$module" -maxdepth 1 -type f -name '*.stl' -size +1024c | wc -l)
            echo "$module STL count: $count"
            test "$count" -gt 0
          done

          unzip -t site/downloads/stl/135er_Heli_Control_Cyclic_STL.zip
          unzip -t site/downloads/stl/135er_Heli_Control_Collective_STL.zip
          unzip -t site/downloads/stl/135er_Heli_Control_Pedals_STL.zip
          unzip -t site/downloads/stl/135er_Heli_Control_All_STL.zip

      - name: Render static STL preview images
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/render_stl_previews.sh
          scripts/render_stl_previews.sh \
            site/downloads/stl/build \
            site/assets/stl-previews \
            site/assets/stl-previews/manifest.json
          test -s site/assets/stl-previews/manifest.json
          test "$(find site/assets/stl-previews -type f -name '*.webp' -size +1024c | wc -l)" -gt 0


      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEZENDER_SSH_PORT" -H "$DEZENDER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH maintenance access
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEZENDER_SSH_PASSWORD"
          sshpass -e ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$DEZENDER_SSH_PORT"             "$DEZENDER_SSH_USER@$DEZENDER_HOST"             'printf "SSH_OK\n"; test -d httpdocs'

      - name: Deploy website to Plesk document root
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEZENDER_SSH_PASSWORD"

          sshpass -e ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$DEZENDER_SSH_PORT"             "$DEZENDER_SSH_USER@$DEZENDER_HOST"             'rm -rf httpdocs/helicopter-controller && mkdir -p httpdocs/helicopter-controller'

          tar -C site -czf - . |           sshpass -e ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$DEZENDER_SSH_PORT"             "$DEZENDER_SSH_USER@$DEZENDER_HOST"             'tar -xzf - -C httpdocs/helicopter-controller'

          sshpass -e ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$DEZENDER_SSH_PORT"             "$DEZENDER_SSH_USER@$DEZENDER_HOST"             'test -f httpdocs/helicopter-controller/index.html && grep -q "135er Heli Control" httpdocs/helicopter-controller/index.html && echo "SERVER_FILES_OK"'

      - name: Verify public website
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/heli-site.html -w "%{http_code}" "https://dezender.de/helicopter-controller/")
          echo "HTTP_STATUS=$code"
          test "$code" = "200"
          grep -q "135er Heli Control" /tmp/heli-site.html
          grep -q "Precision in Flight" /tmp/heli-site.html
          curl -L -f -sS -o /tmp/cyclic-stl.zip "https://dezender.de/helicopter-controller/downloads/stl/135er_Heli_Control_Cyclic_STL.zip"
          test -s /tmp/cyclic-stl.zip
          unzip -t /tmp/cyclic-stl.zip >/dev/null
          curl -L -f -sS -o /tmp/cyclic-base.stl "https://dezender.de/helicopter-controller/downloads/stl/build/cyclic/base.stl"
          test $(wc -c < /tmp/cyclic-base.stl) -gt 1024
          curl -L -f -sS -o /tmp/stl-manifest.json "https://dezender.de/helicopter-controller/assets/stl-previews/manifest.json"
          python3 -m json.tool /tmp/stl-manifest.json >/dev/null
          preview=$(python3 - <<'PY'
import json
m=json.load(open('/tmp/stl-manifest.json'))
print(m[0]['preview'] if m else '')
PY
)
          test -n "$preview"
          curl -L -f -sS -o /tmp/stl-preview.webp "https://dezender.de/helicopter-controller/$preview"
          test $(wc -c < /tmp/stl-preview.webp) -gt 1024
          echo "PUBLIC_SITE_OK"
