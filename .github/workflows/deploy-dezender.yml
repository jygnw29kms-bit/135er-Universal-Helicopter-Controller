name: Deploy dezender website

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/deploy-dezender.yml
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEZENDER_HOST: ${{ secrets.DEZENDER_HOST }}
      DEZENDER_USER: ${{ secrets.DEZENDER_USER }}
      DEZENDER_PASSWORD: ${{ secrets.DEZENDER_PASSWORD }}
      DEZENDER_FTP_PATH: ${{ secrets.DEZENDER_FTP_PATH }}
      DEZENDER_SSH_USER: ${{ secrets.DEZENDER_SSH_USER }}
      DEZENDER_SSH_PASSWORD: ${{ secrets.DEZENDER_SSH_PASSWORD }}
      DEZENDER_SSH_PORT: ${{ secrets.DEZENDER_SSH_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEZENDER_HOST"
          test -n "$DEZENDER_USER"
          test -n "$DEZENDER_PASSWORD"
          test -n "$DEZENDER_FTP_PATH"
          test -n "$DEZENDER_SSH_USER"
          test -n "$DEZENDER_SSH_PASSWORD"
          test -n "$DEZENDER_SSH_PORT"

      - name: Install deploy tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp sshpass

      - name: Test SSH maintenance access
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEZENDER_SSH_PORT" -H "$DEZENDER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$DEZENDER_SSH_PASSWORD"
          sshpass -e ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -p "$DEZENDER_SSH_PORT"             "$DEZENDER_SSH_USER@$DEZENDER_HOST"             "printf 'SSH_OK\n'"

      - name: Diagnose Plesk webroot
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEZENDER_SSH_PASSWORD"
          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -p "$DEZENDER_SSH_PORT" \
            "$DEZENDER_SSH_USER@$DEZENDER_HOST" \
            'echo "REMOTE_PWD=$(pwd)"; echo "--- ROOT ---"; ls -la; echo "--- DIRS ---"; find . -maxdepth 3 -type d 2>/dev/null | sort | head -200; echo "--- HTTPDOCS ---"; find . -maxdepth 4 -type d -name httpdocs -print 2>/dev/null'

      - name: Deploy website over FTPS
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$DEZENDER_USER","$DEZENDER_PASSWORD" "$DEZENDER_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 20
          mkdir -p "$DEZENDER_FTP_PATH"
          mirror -R --delete --verbose site/ "$DEZENDER_FTP_PATH/"
          bye
          EOF
