name: Deploy dezender website

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - .github/workflows/deploy-dezender.yml
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEZENDER_HOST: ${{ secrets.DEZENDER_HOST }}
      DEZENDER_USER: ${{ secrets.DEZENDER_USER }}
      DEZENDER_PORT: ${{ secrets.DEZENDER_PORT }}
      DEZENDER_PATH: ${{ secrets.DEZENDER_PATH }}
      DEZENDER_PASSWORD: ${{ secrets.DEZENDER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEZENDER_HOST"
          test -n "$DEZENDER_USER"
          test -n "$DEZENDER_PORT"
          test -n "$DEZENDER_PATH"
          test -n "$DEZENDER_PASSWORD"

      - name: Install SSH password helper
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Prepare host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$DEZENDER_PORT" -H "$DEZENDER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH and create target
        shell: bash
        run: |
          set -euo pipefail
          SSHPASS="$DEZENDER_PASSWORD" sshpass -e             ssh -o PreferredAuthentications=password                 -o PubkeyAuthentication=no                 -p "$DEZENDER_PORT"                 "$DEZENDER_USER@$DEZENDER_HOST"                 "mkdir -p '$DEZENDER_PATH'"

      - name: Deploy site
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEZENDER_PASSWORD"
          sshpass -e rsync -az --delete             -e "ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p $DEZENDER_PORT"             site/             "$DEZENDER_USER@$DEZENDER_HOST:$DEZENDER_PATH/"
